name: AuraHealth CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create mock google-services.json for CI
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "1234567890",
                "project_id": "aurahealth-ci-mock",
                "storage_bucket": "aurahealth-ci-mock.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                    "android_client_info": {
                      "package_name": "com.pro.aifitnesstracker"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyMockKeyForCIAutomationOnly123456"
                    }
                  ],
                  "services": {
                    "analytics_service": {
                      "status": 1
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Run Kotlin Compilation Check
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aurahealth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
